<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas List 2026</title>
<meta name="description" content="My Christmas wish list for 2026. Every item links straight to the store.">
<meta property="og:type" content="website">
<meta property="og:title" content="My Christmas Wish List 2026">
<meta property="og:description" content="Every item links straight to the store.">
<meta property="og:url" content="https://rinop13.github.io/christmas-list/">
<meta property="og:image" content="https://rinop13.github.io/christmas-list/img/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0c2416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c2416;
    --bg-2: #08190f;
    --card: #fbf7ef;
    --ink: #1d2420;
    --muted: #6b716c;
    --red: #c8102e;
    --red-dark: #9c0c24;
    --red-glow: #ff4d5e;
    --green: #1e7a3c;
    --green-glow: #4be38a;
    --gold: #e8c46a;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--card);
    background:
      radial-gradient(900px 500px at 15% -150px, rgba(200,16,46,.28) 0%, transparent 70%),
      radial-gradient(900px 500px at 85% -150px, rgba(30,122,60,.45) 0%, transparent 70%),
      linear-gradient(var(--bg), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* falling snow */
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* string of lights */
  #lights {
    position: absolute; top: 0; left: 0; right: 0; height: 110px;
    pointer-events: none; z-index: 2;
  }
  #lights svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bulb {
    --c: var(--red-glow);
    position: absolute; width: 14px; height: 24px;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(var(--r));
    animation: sway var(--s) ease-in-out var(--d) infinite alternate;
  }
  .bulb.green { --c: var(--green-glow); }
  .bulb::before {
    content: ""; position: absolute; top: 0; left: 3px;
    width: 8px; height: 8px; border-radius: 2px;
    background: linear-gradient(90deg, #2b332d, #59625b, #2b332d);
  }
  .bulb::after {
    content: ""; position: absolute; top: 7px; left: 0;
    width: 14px; height: 18px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 38%), var(--c);
    box-shadow: 0 6px 22px 6px var(--c), 0 0 6px 1px var(--c);
    animation: twinkle var(--t) ease-in-out var(--d) infinite;
  }
  @keyframes sway {
    from { transform: translate(-50%, 0) rotate(calc(var(--r) - 5deg)); }
    to   { transform: translate(-50%, 0) rotate(calc(var(--r) + 5deg)); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; filter: brightness(1.15); }
    50%      { opacity: .55; filter: brightness(.7); box-shadow: 0 4px 10px 1px var(--c); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bulb, .bulb::after { animation: none; }
  }

  header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 120px 20px 36px;
  }
  .eyebrow {
    letter-spacing: .3em; text-transform: uppercase;
    font-size: 12px; color: var(--green-glow); font-weight: 600;
  }
  .candy {
    width: 180px; height: 7px; margin: 22px auto 0; border-radius: 99px;
    background: repeating-linear-gradient(-45deg, var(--red) 0 10px, #fff 10px 20px, var(--green) 20px 30px, #fff 30px 40px);
    box-shadow: 0 0 12px rgba(255,77,94,.35);
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(44px, 8vw, 84px);
    line-height: 1;
    margin: 14px 0 12px;
  }
  h1 span {
    color: var(--red-glow); font-style: italic; font-weight: 500;
    text-shadow: 0 0 24px rgba(255,77,94,.55);
  }
  .sub { color: #c9d3cc; font-size: 16px; margin: 0; }
  .summary {
    display: inline-flex; gap: 22px; margin-top: 26px;
    padding: 10px 22px; border-radius: 999px;
    background: var(--red); border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 8px 24px -8px rgba(200,16,46,.7);
    font-size: 14px; color: #ffe9ec;
  }
  .summary b { color: #fff; }
  .actions { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 26px; }
  .actions .summary { margin-top: 0; }
  .share {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    background: var(--green); color: #fff; border: 1px solid rgba(255,255,255,.18);
    font: 600 14px "Inter", system-ui, sans-serif;
    box-shadow: 0 8px 24px -8px rgba(30,122,60,.8);
    transition: transform .15s ease, background .2s ease;
  }
  .share:hover { background: #239146; transform: translateY(-1px); }
  .share svg { width: 16px; height: 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #fff; color: var(--ink); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  main {
    position: relative; z-index: 1;
    max-width: 860px; margin: 0 auto; padding: 10px 20px 80px;
    display: grid; gap: 18px;
    grid-template-columns: repeat(3, 1fr);
  }

  @media (max-width: 760px) { main { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { main { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); color: var(--ink);
    border-radius: 14px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.6);
    border-top: 5px solid var(--red);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:nth-child(even) { border-top-color: var(--green); }
  .card:nth-child(even) .tag { background: var(--green); }
  .card:hover { transform: translateY(-4px); box-shadow: 0 28px 50px -20px rgba(0,0,0,.7); }

  .photo {
    position: relative;
    background: #fff;
    aspect-ratio: 2 / 1;
    border-bottom: 1px solid #eee6d6;
  }
  .photo img {
    position: absolute; inset: 10px;
    width: calc(100% - 20px); height: calc(100% - 20px);
    object-fit: contain;
  }
  .tag {
    position: absolute; top: 9px; left: 9px; z-index: 1;
    background: var(--red); color: #fff;
    font-size: 9.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px;
  }
  .num {
    position: absolute; top: 7px; right: 10px; z-index: 1;
    font-family: "Fraunces", serif; font-size: 16px; color: #d8cfbd;
  }

  .body { padding: 13px 14px 14px; display: flex; flex-direction: column; flex: 1; }
  .store { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  h2 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 16px; line-height: 1.2; margin: 4px 0 6px;
  }
  .note { font-size: 12.5px; line-height: 1.45; color: #454c47; margin: 0 0 12px; }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: auto; margin-bottom: 11px; }
  .price { font-size: 19px; font-weight: 600; }
  .was { color: var(--muted); text-decoration: line-through; font-size: 12.5px; }
  .off { color: var(--red); font-size: 11.5px; font-weight: 600; }

  .parts { display: grid; gap: 7px; margin-top: auto; margin-bottom: 11px; }
  .part {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px;
    padding: 6px 8px 6px 6px; border-radius: 9px;
    background: #fff; border: 1px solid #eee6d6;
    text-decoration: none; color: var(--ink);
    transition: border-color .2s ease, transform .2s ease;
  }
  .part:hover { border-color: var(--red); transform: translateX(2px); }
  .part img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; }
  .part-name { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
  .part-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .part-price { text-align: right; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .part-price s { display: block; color: var(--muted); font-weight: 400; font-size: 10.5px; }
  .bundle-total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; font-size: 12px; color: var(--muted); }
  .bundle-total b { font-size: 18px; color: var(--ink); }

  .btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--red); color: #fff; font-weight: 600;
    padding: 9px 12px; border-radius: 9px; font-size: 13.5px;
    transition: background .2s ease;
  }
  .btn:hover { background: var(--red-dark); }
  .backup {
    display: block; margin-top: 8px; text-align: center;
    font-size: 11px; color: var(--muted); text-decoration: none;
  }
  .backup:hover { color: var(--red); text-decoration: underline; }

  footer {
    position: relative; z-index: 1;
    text-align: center; color: #8fa197; font-size: 13px; padding: 0 20px 40px;
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="lights" aria-hidden="true"></div>

<header>
  <div class="eyebrow">Christmas 2026</div>
  <h1>My Wish <span>List</span></h1>
  <p class="sub">Click any item to go straight to the store.</p>
  <div class="actions">
    <div class="summary" id="summary"></div>
    <button class="share" id="share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      Share list
    </button>
  </div>
  <div class="candy"></div>
</header>
<div class="toast" id="toast">Link copied</div>

<main id="list"></main>

<footer>Prices checked November 11–12, 2026. Black Friday may knock them lower.</footer>

<script>
  // Add new items here
  const ITEMS = [
    {
      name: "EcoFlow RAPID Pro X Power Bank",
      store: "Amazon",
      note: "27,650 mAh with 300W output and a built-in retractable 140W cable. Strong enough to charge a laptop.",
      price: 169.99,
      was: 249.99,
      img: "img/ecoflow-powerbank.jpg",
      url: "https://www.amazon.com/dp/B0FHB5HZFR",
      tag: "Top pick"
    },
    {
      name: "EcoFlow RAPID Pro 320W Charging Station",
      store: "Amazon",
      note: "5-port GaN desk charger for up to 6 devices. Its pogo-pin dock charges the power bank above to 80% in 20 minutes.",
      price: 139.99,
      was: 189.99,
      img: "img/ecoflow-charger.jpg",
      url: "https://www.amazon.com/dp/B0GSZ37B1J",
      tag: "Pairs with #1"
    },
    {
      name: "NOMATIC Navigator Pack 15L, Black",
      store: "Nomatic",
      note: "Slim 5.5\" everyday pack that zips out from 15L to 21L for travel. 840D ballistic nylon, 16\" laptop pocket plus a tablet/document sleeve, water-resistant zippers and a lifetime warranty.",
      price: 279.99,
      img: "img/nomatic-navigator-15l.jpg",
      url: "https://www.nomatic.com/products/navigator-backpack-15l",
      tag: "Expands 15L → 21L"
    },
    {
      name: "Hacksmith Mini-Saber Gen 2, Light Edition + Green Insert",
      store: "Hacksmith",
      note: "All-metal, lightsaber-style butane torch in the white Light Edition. The spare green insert turns the flame green. Ships empty, fill with hardware-store butane.",
      img: "img/minisaber-light.jpg",
      tag: "Black Friday 50% off",
      parts: [
        {
          name: "Mini-Saber Gen 2 Light Edition",
          sub: "Comes with one green insert installed",
          price: 46.00,
          was: 92.00,
          img: "img/minisaber-light.jpg",
          url: "https://hacksmith.store/en-us/products/mini-saber-gen-2-light-edition?variant=44303293677783"
        },
        {
          name: "Gen 2 Colour Changing Insert",
          sub: "For Gen 2 · Green",
          price: 9.00,
          was: 18.00,
          img: "img/minisaber-insert-green.jpg",
          url: "https://hacksmith.store/en-us/products/gen-2-mini-saber-colour-changing-insert?variant=43562873716951"
        }
      ]
    },
    {
      name: "REEKON T1R Range Hybrid Measuring Tool (English units)",
      store: "REEKON",
      note: "16 ft digital tape, 165 ft laser and dual-axis level in one, with a green alignment laser and 1,000+ saved readings. Bluetooth keyboard mode types measurements straight into CAD or any app. USB-C, replaceable blade. Pre-order, ships early December, fully refundable until it ships.",
      price: 279.99,
      was: 319.99,
      img: "img/reekon-t1r.jpg",
      url: "https://reekon.tools/products/t1r-range-hybrid-measuring-tool",
      tag: "Pre-order · ships early Dec",
      backup: {
        label: "If it slips past mid-December: Mileseey XTAPE1",
        price: 199.99,
        url: "https://mileseeytools.com/products/xtape-1-modular-digital-laser-tape-measure"
      }
    },
    {
      name: "iPhone 18 Pro, 512GB Black + Metal Case",
      store: "Apple + BlueBolt",
      note: "The 6.3\" iPhone 18 Pro in Black with 512GB, plus a black metal MagSafe case with a raised camera guard to keep it looking new.",
      img: "img/iphone-18-pro-black.jpg",
      tag: "Phone + case",
      parts: [
        {
          name: "iPhone 18 Pro 6.3\", 512GB, Black",
          sub: "Apple · Verizon (same price on any carrier)",
          price: 1399.00,
          img: "img/iphone-18-pro-black.jpg",
          url: "https://www.apple.com/shop/buy-iphone/iphone-18-pro/6.3-inch-display-512gb-black-verizon"
        },
        {
          name: "Metal Case with Camera Guard",
          sub: "BlueBolt · iPhone 18 Pro · Black",
          price: 34.99,
          was: 69.99,
          img: "img/bluebolt-case-black.jpg",
          url: "https://www.blueboltchargers.com/products/iphone-metal-case-with-camera-guard?variant=49546046046446"
        }
      ]
    },
    {
      name: "NVIDIA Tesla V100 32GB GPU",
      store: "eBay",
      note: "32GB datacenter GPU for running bigger AI models locally. Sold by hanshou888 (98.8% positive).",
      price: 856.85,
      was: 901.95,
      img: "img/tesla-v100.jpg",
      url: "https://www.ebay.com/itm/366380684152",
      tag: "32GB for AI"
    },
    {
      name: "Bruno Marc Classic Leather Dress Shoes, Brown",
      store: "Amazon",
      note: "Full-grain leather plain-toe derby with a cushioned midsole and non-slip rubber sole. Size 10 Wide.",
      price: 65.99,
      was: 79.99,
      img: "img/bruno-marc-brown.jpg",
      url: "https://www.amazon.com/dp/B0HC28DVC1?th=1&psc=1",
      tag: "Size 10 Wide"
    }
  ];

  // A bundle's price is the sum of its parts
  for (const it of ITEMS) if (it.parts) {
    it.price = it.parts.reduce((s, p) => s + p.price, 0);
    it.was = it.parts.reduce((s, p) => s + (p.was || p.price), 0);
    it.url = it.parts[0].url;
  }

  const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  document.getElementById("list").innerHTML = ITEMS.map((it, i) => {
    const off = it.was ? Math.round((1 - it.price / it.was) * 100) : 0;
    return `
      <article class="card">
        <a class="photo" href="${it.url}" target="_blank" rel="noopener">
          ${it.tag ? `<span class="tag">${it.tag}</span>` : ""}
          <span class="num">${String(i + 1).padStart(2, "0")}</span>
          <img src="${it.img}" alt="${it.name}" loading="lazy">
        </a>
        <div class="body">
          <div class="store">${it.store}</div>
          <h2>${it.name}</h2>
          <p class="note">${it.note}</p>
          ${it.parts ? `
          <div class="parts">
            ${it.parts.map(p => `
              <a class="part" href="${p.url}" target="_blank" rel="noopener">
                <img src="${p.img}" alt="${p.name}" loading="lazy">
                <div><div class="part-name">${p.name}</div><div class="part-sub">${p.sub}</div></div>
                <div class="part-price">${money(p.price)}${p.was ? `<s>${money(p.was)}</s>` : ""}</div>
              </a>`).join("")}
          </div>
          <div class="bundle-total"><span>Together${off >= 5 ? ` <span class="off">${off}% off</span>` : ""}</span><b>${money(it.price)}</b></div>
          ` : `
          <div class="price-row">
            <span class="price">${money(it.price)}</span>
            ${it.was ? `<span class="was">${money(it.was)}</span><span class="off">${off}% off</span>` : ""}
          </div>
          <a class="btn" href="${it.url}" target="_blank" rel="noopener">View on ${it.store} &rarr;</a>
          ${it.backup ? `<a class="backup" href="${it.backup.url}" target="_blank" rel="noopener">Backup &middot; ${it.backup.label} &middot; ${money(it.backup.price)} &rarr;</a>` : ""}`}
        </div>
      </article>`;
  }).join("");

  const total = ITEMS.reduce((s, it) => s + it.price, 0);
  document.getElementById("summary").innerHTML =
    `<span><b>${ITEMS.length}</b> item${ITEMS.length === 1 ? "" : "s"}</span><span>Total <b>${money(total)}</b></span>`;

  // Share button: native share sheet on phones, copy the link everywhere else
  const toast = document.getElementById("toast");
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }
  document.getElementById("share").addEventListener("click", async () => {
    const url = location.href.split("?")[0].split("#")[0];
    const data = { title: "My Christmas Wish List 2026", text: "Here's my Christmas list, every item links straight to the store.", url };
    if (navigator.share) {
      try { await navigator.share(data); } catch (e) { /* closed the share sheet */ }
      return;
    }
    try { await navigator.clipboard.writeText(url); showToast("Link copied, paste it anywhere"); }
    catch { prompt("Copy this link:", url); }
  });

  // String of lights swagging across the top
  const lights = document.getElementById("lights");
  function drawLights() {
    const w = document.documentElement.clientWidth;
    const seg = w < 600 ? 120 : 170;           // width of one swag
    const n = Math.ceil(w / seg);
    const top = 6, sag = 46, perSeg = 3;
    const pt = (x0, t) => {                    // point on a quadratic swag
      const x1 = x0 + seg / 2, x2 = x0 + seg;
      const x = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * x1 + t * t * x2;
      const y = (1 - t) ** 2 * top + 2 * (1 - t) * t * (top + sag * 2) + t * t * top;
      const dx = 2 * (1 - t) * (x1 - x0) + 2 * t * (x2 - x1);
      const dy = 2 * (1 - t) * (sag * 2) - 2 * t * (sag * 2);
      return { x, y, deg: Math.atan2(dy, dx) * 180 / Math.PI };
    };
    let d = "", bulbs = "", k = 0;
    for (let i = 0; i < n; i++) {
      const x0 = i * seg;
      d += `M${x0},${top} Q${x0 + seg / 2},${top + sag * 2} ${x0 + seg},${top} `;
      for (let j = 1; j <= perSeg; j++) {
        const p = pt(x0, j / (perSeg + 1));
        const color = k++ % 2 ? "green" : "red";
        bulbs += `<span class="bulb ${color}" style="left:${p.x}px;top:${p.y - 2}px;--r:${(p.deg * 0.35).toFixed(1)}deg;--t:${(1.6 + Math.random() * 2.2).toFixed(2)}s;--s:${(2.4 + Math.random() * 1.6).toFixed(2)}s;--d:${(-Math.random() * 4).toFixed(2)}s"></span>`;
      }
    }
    lights.innerHTML = `<svg><path d="${d}" fill="none" stroke="#1a2a1f" stroke-width="2.5"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/></svg>${bulbs}`;
  }
  drawLights();
  let lightsTimer;
  addEventListener("resize", () => { clearTimeout(lightsTimer); lightsTimer = setTimeout(drawLights, 150); });

  // Snow
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  let flakes = [];
  function size() {
    c.width = innerWidth; c.height = innerHeight;
    flakes = Array.from({ length: Math.min(140, innerWidth / 8) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 2.2 + .6, s: Math.random() * .6 + .25, d: Math.random() * 2 * Math.PI
    }));
  }
  function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (const f of flakes) {
      f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3;
      if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener("resize", size);
  size(); tick();
</script>
</body>
</html>
